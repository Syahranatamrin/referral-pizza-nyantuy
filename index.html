let popT;function popOk(t){let p=$('popOk');if(!p){p=document.createElement('div');p.id='popOk';p.setAttribute('role','alertdialog');p.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9999';p.innerHTML='<div style="background:#fff;border-radius:16px;padding:28px 32px;max-width:340px;width:85%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)"><div style="width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:#e6f4ea;display:flex;align-items:center;justify-content:center;font-size:34px;color:#2e7d32">✓</div><h3 style="margin:0 0 6px;color:#2e7d32">Berhasil!</h3><p id="popOkT" style="margin:0 0 18px;color:#444;font-size:15px"></p><button class="btn p" style="min-width:120px;min-height:44px" onclick="tutupPop()">OK</button></div>';p.onclick=e=>{if(e.target===p)tutupPop()};document.body.appendChild(p)}$('popOkT').textContent=String(t).replace(/^✅\s*/,'').replace(/^Berhasil:\s*/,'');p.style.display='flex';clearTimeout(popT);popT=setTimeout(tutupPop,2500)}
function tutupPop(){const p=$('popOk');if(p)p.style.display='none'}
async function tesAksi(){try{const r=await fetch($('sAct').value,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'ping'})});bAct(r.ok?'ok':'err',r.ok?'✅ Webhook aksi merespons.':'⚠️ Webhook aksi HTTP '+r.status)}catch(e){bAct('err','⚠️ Webhook aksi tidak bisa dihubungi: '+e.message)}}
function isiSet(){$('sData').value=S.data;$('sLog').value=S.log;$('sAct').value=S.act;$('sPer').value=S.per;$('sMax').value=S.max;$('sPin').value=S.pin}
function simpanSet(){S=Object.assign({},S,{log:$('sLog').value.trim()||DEF.log,data:$('sData').value.trim(),act:$('sAct').value.trim(),per:Math.max(1,+$('sPer').value||5),max:Math.min(5,Math.max(1,+$('sMax').value||5)),pin:$('sPin').value||'1234'});localStorage.setItem('refSet',JSON.stringify(S));bAct('ok','✅ Pengaturan disimpan');D=D.map(o=>(o.rw=reward(o),o));render();muat()}
function exportCSV(){const h=['row_number','tanggal','nama','whatsapp','kode','sumber','status_kirim','qty_klaim','free_didapat','free_diklaim','free_jatuh_tempo','wa_duplikat'];const rows=filtered().map(o=>[o.row,o.tgl?dkey(o.tgl):'',o.nama,o.wa,o.kode,o.sumber,o.kirim,o.qty,o.rw.earned,o.rw.claimed,o.rw.due||'',o.dup]);const csv='\ufeff'+[h,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='referral-'+dkey(new Date())+'.csv';a.click()}

/* ===== Dashboard Nominal (Log Klaim) ===== */
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const rpS=n=>n>=1e6?'Rp'+(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':n>=1e3?'Rp'+Math.round(n/1e3)+'rb':rp(n);
function nom(v){if(typeof v==='number')return v;const d=String(v??'').split(/[,]/)[0].replace(/\D/g,'');return d?+d:0}
function tglLog(v){if(v instanceof Date)return v;v=String(v??'').trim().replace(/,\s*/,' ').replace(/(\s)(\d{1,2})\.(\d{2})(?:\.(\d{2}))?$/,(m,s,h,mi,se)=>s+h+':'+mi+(se?':'+se:''));return v?tgl(v):null}
function pengN(v){v=String(v||'').trim();return/admin/i.test(v)?'Admin':/kasir/i.test(v)?'Kasir':(v||'Lainnya')}
function normLog(raw){const rows=Array.isArray(raw)?raw:(raw&&Array.isArray(raw.data)?raw.data:(raw?[raw]:[]));return rows.filter(r=>r&&typeof r==='object').map(r=>{const g=k=>{if(r[k]!=null)return r[k];const kk=Object.keys(r).find(x=>x.trim().toLowerCase()===k.toLowerCase());return kk?r[kk]:''};return{tgl:tglLog(g('Tanggal')),cust:String(g('Nama Customer')).trim(),kode:String(g('Kode Referral')).trim(),peng:pengN(g('Penginput')),outlet:outN(g('Outlet')),nom:nom(g('Nominal Pembelian'))}}).filter(o=>o.kode||o.nom)}
let perHari=30;
async function muatLog(){const m=$('logMsg');try{const r=await fetch(S.log,{cache:'no-store'});if(!r.ok)throw Object.assign(new Error('HTTP '+r.status),{st:r.status});const t=await r.text();L=normLog(t.trim()?JSON.parse(t):[]);m.className='banner';$('nomWrap').classList.remove('hide');document.querySelectorAll('.lf').forEach(e=>e.classList.remove('hide'));$('updLog').textContent='Log diperbarui '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' · '+L.length+' transaksi';renderLog()}catch(e){console.warn('log',e);L=[];$('nomWrap').classList.add('hide');document.querySelectorAll('.lf').forEach(e=>e.classList.add('hide'));$('updLog').textContent='';m.className='banner warn';m.innerHTML='ℹ️ <b>Data Log Klaim belum tersambung (webhook db-log-klaim).</b><br><small>'+(e.st===404?'Webhook belum dibuat / belum aktif di n8n.':'Tidak bisa dihubungi, cek internet atau CORS.')+' Bagian Peserta di bawah tetap bisa dipakai.</small>'}}
function renderLog(){const outs=[...new Set(L.map(o=>o.outlet))].sort();const fo=$('fOut'),cur=fo.value;fo.innerHTML='<option value="">Outlet: semua</option>'+outs.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');
let st=null;if(perHari){st=new Date();st.setHours(0,0,0,0);st=new Date(+st-(perHari-1)*864e5)}const X=L.filter(o=>(!st||(o.tgl&&o.tgl>=st))&&(!fo.value||o.outlet===fo.value));
const sum=a=>a.reduce((s,o)=>s+o.nom,0),tot=sum(X),K=sum(X.filter(o=>o.peng==='Kasir')),A=sum(X.filter(o=>o.peng==='Admin'));
$('kpiNom').innerHTML=[['Total nominal',rp(tot)],['Jumlah transaksi',X.length],['Rata-rata / transaksi',rp(X.length?tot/X.length:0)],['Nominal Kasir',rp(K)],['Nominal Admin',rp(A)]].map(k=>`<div class="card kpi big"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
const top={};X.forEach(o=>{const k=o.kode.toLowerCase();(top[k]=top[k]||{kode:o.kode,n:0,t:0}).n++;top[k].t+=o.nom});const T=Object.values(top).sort((a,b)=>b.t-a.t).slice(0,5);
$('tTop').innerHTML=T.map((o,i)=>{const p=D.find(d=>d.kode.toLowerCase()===o.kode.toLowerCase());return`<tr><td>${i+1}</td><td><b>${esc(o.kode)}</b></td><td>${p?esc(p.nama):'<small>-</small>'}</td><td class="r">${o.n}</td><td class="r"><b>${rp(o.t)}</b></td></tr>`}).join('')||'<tr><td colspan="5"><small>Belum ada transaksi di periode ini.</small></td></tr>';
if(!window.Chart)return;[ch3,ch4,ch5].forEach(c=>c&&c.destroy());const C={Kasir:'#c8691c',Admin:'#7a3e12',Lainnya:'#999'};const PG=['Kasir','Admin'].concat(X.some(o=>o.peng!=='Kasir'&&o.peng!=='Admin')?['Lainnya']:[]);const bp=(arr,p)=>sum(arr.filter(o=>p==='Lainnya'?(o.peng!=='Kasir'&&o.peng!=='Admin'):o.peng===p));
const tipRp={callbacks:{label:c=>`${c.dataset.label&&c.chart.config.type!=='doughnut'?c.dataset.label+': ':c.label+': '}${rp(c.raw)}`}};
ch3=new Chart($('cPeng'),{type:'doughnut',data:{labels:PG,datasets:[{data:PG.map(p=>bp(X,p)),backgroundColor:PG.map(p=>C[p])}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);return`${c.label}: ${rp(c.raw)} (${t?(c.raw/t*100).toLocaleString('id-ID',{maximumFractionDigits:1}):0}%)`}}}}}});
const OU=[...new Set(X.map(o=>o.outlet))].map(o=>({o,t:sum(X.filter(x=>x.outlet===o))})).sort((a,b)=>b.t-a.t).map(x=>x.o);
ch4=new Chart($('cOut'),{type:'bar',data:{labels:OU,datasets:PG.map(p=>({label:p,data:OU.map(u=>bp(X.filter(o=>o.outlet===u),p)),backgroundColor:C[p]}))},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+rp(c.raw),footer:it=>'Total outlet: '+rp(sum(X.filter(o=>o.outlet===it[0].label)))}}},scales:{x:{stacked:true,beginAtZero:true,ticks:{callback:v=>rpS(v)}},y:{stacked:true}}}});
const HK=[...new Set(X.filter(o=>o.tgl).map(o=>dkey(o.tgl)))].sort();const lbl=k=>{const[y,m,d]=k.split('-');return d+'/'+m};
ch5=new Chart($('cTren'),{type:'bar',data:{labels:HK.map(lbl),datasets:PG.map(p=>({label:p,data:HK.map(k=>bp(X.filter(o=>o.tgl&&dkey(o.tgl)===k),p)),backgroundColor:C[p]}))},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{mode:'index',callbacks:{label:c=>c.dataset.label+': '+rp(c.raw)}}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>rpS(v)}}}}})}
document.querySelectorAll('#fPer button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fPer button').forEach(x=>x.classList.toggle('on',x===b));perHari=+b.dataset.v;renderLog()});$('fOut').onchange=renderLog;
$('auto').onchange=e=>{clearInterval(timer);if(e.target.checked)timer=setInterval(muat,60000)};
if(!S.act)bAct('warn','ℹ️ URL aksi belum diatur.');isiSet();if(sessionStorage.ok)muat();
